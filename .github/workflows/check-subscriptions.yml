name: Check subscriptions

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

# Prevents a slow or delayed run from overlapping the next scheduled trigger,
# which could double-send notifications for the same subscriptions.
concurrency:
  group: check-subscriptions
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          curl --fail --show-error --silent \
            -X POST "${APP_BASE_URL}/api/cron/check-subscriptions" \
            -H "Authorization: Bearer ${CRON_SECRET}"
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
