name: Propose test failure fix

on:
  workflow_run:
    workflows: ['Frontend UI tests']
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

concurrency:
  group: test-fix-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Propose one evidence-based fix and notify Slack after PR verification
        run: node scripts/propose-test-fix.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_WORKFLOW_PATH: .github/workflows/ui-tests.yml
          TEST_STEP: Run UI and notification tests
          TEST_SERVICE: Frontend
